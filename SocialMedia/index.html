<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>
    <article class="post">
        <header class="postHeader">
            <span class="username">naam</span>
        </header>

        <figure class="postImage">
            <img src="https://www.cats.org.uk/media/yhxbyvoy/230215case104.jpg" alt="kat">
        </figure>

        <footer class="postFooter">
            <div class="buttons">
                <div class="left-buttons">
                    <button class="btn-icon" aria-label="Likes">❤️</button>
                    <button class="btn-icon" aria-label="Reageren">💬</button>
                    <button class="btn-icon" aria-label="Delen">✈️</button>
                </div>
                <button class="btn-icon" aria-label="Opslaan">🔖</button>
            </div>

            <p class="likesText"><strong>142 Likes</strong></p>

            <p class="postText">
                <strong>naam</strong> Lorem ipsum dolor sit amet consectetur adipisicing elit. Excepturi non qui repudiandae obcaecati unde dolor quo nobis saepe alias nisi blanditiis cumque maxime, rem sit a quibusdam ea! Tempore, laudantium?
            </p>

            <div class="commentsSection">
                <span class="timeAgo">2 UUR GELEDEN</span>
            </div>
        </footer>
    </article>
</body>
</html>
