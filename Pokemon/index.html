<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>
    <main class="pokemon">
        <section class="pokemon-info">
            <h2 class="name" id="name">Pokemon Naam</h2>
            <div class="types" id="types"></div>
        </section>

        <section class="pokemon-image">
            <img class="name" id="pokemon-img" src="https://via.placeholder.com/200" alt="Pokemon afbeelding">
        </section>

        <section class="pokemon-stats">
            <ul>
                <li class="stat">HP: -</li>
                <li class="stat">Attack: -</li>
                <li class="stat">Defense: -</li>
                <li class="stat">Sp. Attack: -</li>
                <li class="stat">Sp. Defense: -</li>
                <li class="stat">Speed: -</li>
            </ul>
        </section>

        <section class="pokemon-moves">
            <ul id="moves"></ul>
        </section>
    </main>
</body>
</html>
